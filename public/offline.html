<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0b09">
  <meta name="robots" content="noindex">
  <title>Sin conexión | Aura</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh; min-height: 100dvh;
      display: flex; align-items: center; justify-content: center; text-align: center;
      padding: max(1.5rem, env(safe-area-inset-top)) max(1.5rem, env(safe-area-inset-right)) max(1.5rem, env(safe-area-inset-bottom)) max(1.5rem, env(safe-area-inset-left));
      background: radial-gradient(ellipse 80% 50% at 50% 0%, #2b1e0e 0%, #0d0b09 70%);
      color: #f4ede3; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-text-size-adjust: 100%;
    }
    main { width: 100%; max-width: 26rem; }
    .mark { color: #e9a63c; margin-bottom: 1.25rem; }
    h1 { margin: 0 0 .75rem; font-family: Georgia, "Times New Roman", serif; font-weight: 500; font-size: clamp(1.6rem, 6vw, 2rem); }
    p { margin: 0 0 1.75rem; color: #a99c8a; line-height: 1.6; font-size: .95rem; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; min-height: 3rem; padding: 0 2rem;
      border: 0; border-radius: 999px; background: #e9a63c; color: #1a1006; font: inherit; font-weight: 600; font-size: .9rem;
      cursor: pointer; text-decoration: none; touch-action: manipulation;
    }
    .btn:focus-visible { outline: 2px solid #e9a63c; outline-offset: 3px; }
    #status { margin-top: 1.25rem; font-size: .8rem; color: #a99c8a; min-height: 1.2em; }
  </style>
</head>
<body>
  <main>
    <svg class="mark" width="56" height="56" viewBox="0 0 48 48" fill="none" aria-hidden="true">
      <path d="M10 40 24 8l14 32" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M24 26.5c.5 3 1.6 4.1 4.6 4.6-3 .5-4.1 1.6-4.6 4.6-.5-3-1.6-4.1-4.6-4.6 3-.5 4.1-1.6 4.6-4.6Z" fill="currentColor"/>
    </svg>
    <h1>Sin conexión</h1>
    <p>No pudimos conectar con Aura. Revisa tu conexión a internet; en cuanto vuelva, te llevamos de regreso automáticamente.</p>
    <button class="btn" id="retry" type="button">Reintentar</button>
    <div id="status" role="status" aria-live="polite"></div>
  </main>
  <script>
    (function () {
      var status = document.getElementById("status");
      function go() { location.reload(); }
      document.getElementById("retry").addEventListener("click", function () {
        status.textContent = "Comprobando conexión…";
        setTimeout(function () { if (!navigator.onLine) status.textContent = "Seguimos sin conexión."; }, 800);
        go();
      });
      window.addEventListener("online", go);
    })();
  </script>
</body>
</html>
