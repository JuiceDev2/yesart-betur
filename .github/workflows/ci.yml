name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  # Valores de relleno: solo para compilar y levantar la app en CI.
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example
  NEXT_PUBLIC_SITE_URL: http://localhost:3000

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next
          include-hidden-files: true
          retention-days: 1

  e2e:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next
      - run: npx playwright install --with-deps chromium
      - name: Levantar la app y correr E2E público
        run: |
          npm start &
          npx --yes wait-on@8 http-get://127.0.0.1:3000 --timeout 60000
          npx playwright test e2e/smoke.spec.ts
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results

  lighthouse:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next
      - name: Lighthouse CI (accesibilidad, buenas prácticas y SEO ≥ 0.95)
        run: npm run test:lighthouse

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Levantar Supabase local con las migraciones
        run: |
          supabase init || true
          supabase start -x studio,imgproxy,edge-runtime,logflare,vector,realtime,inbucket
      - name: Pruebas de seguridad (RLS / triggers / RPC)
        run: |
          eval "$(supabase status -o env | sed 's/^/export /')"
          export RLS_TEST_URL="$API_URL" RLS_TEST_ANON_KEY="$ANON_KEY" RLS_TEST_SERVICE_KEY="$SERVICE_ROLE_KEY"
          npm run test:rls
